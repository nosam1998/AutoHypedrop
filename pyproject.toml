[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autohypedrop"
version = "0.1.0"
description = "Self-hosted automation that opens the free drops on your own hypedrop.com account."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Keep in lockstep with the Playwright base image tag in the Dockerfile.
    "playwright==1.63.0",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
autohypedrop = "autohypedrop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autohypedrop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/autohypedrop"]
plugins = ["pydantic.mypy"]
